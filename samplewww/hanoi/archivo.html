<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Torres de Hanoi (cliente ligero)</title>
    <style>
        body {font-family: Arial, sans-serif; padding: 20px;}
        #controls {margin-bottom: 20px;}
        #game {display: flex; justify-content: space-around; align-items: flex-end; height: 320px;}
        .tower {width: 120px; height: 100%; border: 2px solid #333; border-top: none; display: flex; flex-direction: column-reverse; align-items: center; padding-bottom: 10px;}
        .ring {height: 22px; background: steelblue; border: 1px solid #1c3f5f; margin: 3px 0; border-radius: 4px; color: #fff; display: flex; justify-content: center; align-items: center; font-size: 0.8rem;}
    </style>
</head>
<body>
<div id="controls">
    <label for="ringCount">Nº anillos:</label>
    <select id="ringCount">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
    </select>
    <button id="resetBtn">Reset</button>
    <button id="nextBtn">Siguiente movimiento</button>
</div>

<!-- Estado inicial con ids de torre -->
<input type="hidden" id="hanoiData" value='{"torres":[{"id":0,"anillos":[]},{"id":1,"anillos":[]},{"id":2,"anillos":[]}]}'>

<div id="game"></div>

<script>
    const ringCountSelect = document.getElementById("ringCount");
    const resetBtn        = document.getElementById("resetBtn");
    const nextBtn         = document.getElementById("nextBtn");
    const hanoiInput      = document.getElementById("hanoiData");
    const gameDiv         = document.getElementById("game");

    let moveNumber = 0;

    // ---------- Render ----------
    function render() {
      const data = JSON.parse(hanoiInput.value);
      gameDiv.innerHTML = "";

      // Orden fijo de torres por id (0‑1‑2)
      const torresOrdenadas = data.torres.slice().sort((a, b) => a.id - b.id);

      torresOrdenadas.forEach(torre => {
        const towerDiv = document.createElement("div");
        towerDiv.className = "tower";

        // Anillos de mayor → menor
        const anillosOrdenados = torre.anillos.slice().sort((a, b) => b.tamano - a.tamano);
        anillosOrdenados.forEach(anillo => {
          const ring = document.createElement("div");
          ring.className = "ring";
          ring.style.width = anillo.tamano * 20 + 40 + "px";
          ring.textContent = anillo.tamano;
          towerDiv.appendChild(ring);
        });

        gameDiv.appendChild(towerDiv);
      });
    }

    // ---------- Reset ----------
    function reset() {
      const n = parseInt(ringCountSelect.value, 10);
      const torres = [0, 1, 2].map(id => ({ id, anillos: [] }));
      for (let i = n; i >= 1; i--) {
        torres[0].anillos.push({ tamano: i });
      }
      hanoiInput.value = JSON.stringify({ torres });
      moveNumber = 0;
      render();
    }

    // ---------- Siguiente movimiento (sin lógica local) ----------
    async function next() {
      const n = parseInt(ringCountSelect.value, 10);
      moveNumber++;

      // Siempre se envía 0_2 como <de>_<a>
      const url = `http://localhost:8023/__op__/hanoi/0_2_${n}_${moveNumber}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);

        // Se espera que el servidor devuelva el nuevo estado JSON
        const data = await res.json();
        hanoiInput.value = JSON.stringify(data);
        render();
      } catch (err) {
        console.error("Error al obtener el siguiente movimiento", err);
      }
    }

    // ---------- Eventos ----------
    resetBtn.addEventListener("click", reset);
    nextBtn.addEventListener("click", next);
    ringCountSelect.addEventListener("change", reset);

    // Render inicial
    window.addEventListener("load", reset);
</script>
</body>
</html>
